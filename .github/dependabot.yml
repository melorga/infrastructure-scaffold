      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "melorga"
    assignees:
      - "melorga"
    commit-message:
      prefix: "deps"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "melorga"
    assignees:
      - "melorga"
    commit-message:
      prefix: "deps"
      include: "scope"
